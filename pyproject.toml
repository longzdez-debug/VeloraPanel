[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="velora-panel"
version="2.1.0"
description="CS2 orchestration panel with hierarchical FSM, GSI and integrated WalkBot"
requires-python=">=3.12"
dependencies=["httpx>=0.28,<1","pydantic>=2.10,<3","psutil>=6.1,<7"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9","pytest-asyncio>=0.25,<1","ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py312"
